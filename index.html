<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#304f1e">
<title>Getallenbos</title><link rel="apple-touch-icon" href="assets/apple-icon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=20261031e">
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="repeat" viewBox="0 0 32 32"><path d="M6 12h5l7-6v20l-7-6H6Z" fill="currentColor" stroke-width="1.5"/><path d="M23 11q5 5 0 10m4-14q8 9 0 18" stroke-width="2.8"/></symbol>
<symbol id="again-icon" viewBox="0 0 32 32"><path d="M7 10a11 11 0 1 1-1 13M6 4v8h8"/></symbol>
<symbol id="play" viewBox="0 0 32 32"><path d="m10 5 18 11-18 11Z"/></symbol>
<symbol id="computer" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="19" rx="3"/><path d="M16 23v5M10 28h12M10 12h1m10 0h1M12 17q4 3 8 0"/></symbol>
<symbol id="music" viewBox="0 0 32 32"><path d="M12 23V8l15-4v15M12 12l15-4"/><ellipse cx="8" cy="24" rx="4" ry="3" fill="currentColor"/><ellipse cx="23" cy="20" rx="4" ry="3" fill="currentColor"/></symbol>
</defs></svg>
<main class="scene">
<section id="menu">
<h1>Getallenbos</h1>
<div class="friends"><img src="assets/character-0-1.webp" alt="Eekhoorn"><img src="assets/character-1-1.webp" alt="Egel"></div>
<div class="choices">
<button class="selected" data-mode="computer" aria-pressed="true" aria-label="Eén speler tegen de computer"><span class="choice-art solo"><img src="assets/character-0-0.webp" alt=""><svg><use href="#computer"/></svg></span><small>1 speler</small></button>
<button data-mode="friend" aria-pressed="false" aria-label="Twee spelers"><span class="choice-art duo"><img src="assets/character-0-0.webp" alt=""><img src="assets/character-1-0.webp" alt=""></span><small>2 spelers</small></button>
</div>
<button id="start" class="wood start" aria-label="Spelen"><svg><use href="#play"/></svg></button>
</section>
<section id="game" hidden>
<section class="player opposite" id="player-1"><div class="cards" id="cards-1"></div><img class="character" id="character-1" src="assets/character-1-0.webp" alt="Egel"><span class="sr" id="status-1"></span></section>
<section class="player" id="player-0"><div class="cards" id="cards-0"></div><img class="character" id="character-0" src="assets/character-0-0.webp" alt="Eekhoorn"><span class="sr" id="status-0"></span></section>
<div class="dice-zone"><div class="shadow"></div><div class="motion"><div id="die" role="img" aria-label="Dobbelsteen"></div></div><button id="roll" aria-label="Dobbelsteen gooien"></button></div>
<button class="home cottage" id="home-button" aria-label="Naar het beginscherm"><img src="assets/home-cottage.svg" alt=""></button>
<button class="wood repeat" id="repeat-button" aria-label="Hulp beluisteren"><svg><use href="#repeat"/></svg></button>
<img class="foreground" src="assets/leaves.webp" alt="">
<div id="guide" hidden aria-hidden="true"><span class="tap-ring"></span><img src="assets/guide-hand.svg" alt=""></div>
<p id="announcement" class="sr" aria-live="polite"></p>
</section>
<button id="music-button" class="wood music" aria-label="Zachte achtergrondmuziek aanzetten" aria-pressed="false"><svg><use href="#music"/></svg><span class="music-off" aria-hidden="true"></span></button>
<dialog id="leave"><h2>Terug naar het begin?</h2><button class="wood" id="continue" aria-label="Verder spelen"><svg><use href="#play"/></svg></button><button class="cottage" id="quit" aria-label="Naar het begin"><img src="assets/home-cottage.svg" alt=""></button></dialog>
<dialog id="result"><img class="prize" src="assets/magic-4.webp" alt=""><h2 id="result-title" class="sr"></h2><div id="result-players"></div><button class="wood" id="again" aria-label="Nog een keer"><svg><use href="#again-icon"/></svg></button><button class="cottage" id="result-home" aria-label="Anders spelen"><img src="assets/home-cottage.svg" alt=""></button></dialog>
</main><script type="module" src="app.js?v=20261031e"></script>
</body></html>
