<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#304f1e">
<title>Getallenrij</title><link rel="apple-touch-icon" href="assets/apple-icon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=20261104b">
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="repeat" viewBox="0 0 32 32"><path d="M6 12h5l7-6v20l-7-6H6Z" fill="currentColor" stroke-width="1.5"/><path d="M23 11q5 5 0 10m4-14q8 9 0 18" stroke-width="2.8"/></symbol>
<symbol id="again-icon" viewBox="0 0 32 32"><path d="M7 10a11 11 0 1 1-1 13M6 4v8h8"/></symbol>
<symbol id="play" viewBox="0 0 32 32"><path d="m10 5 18 11-18 11Z"/></symbol>
<symbol id="computer" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="19" rx="3"/><path d="M16 23v5M10 28h12M10 12h1m10 0h1M12 17q4 3 8 0"/></symbol>
<symbol id="music" viewBox="0 0 32 32"><path d="M12 23V8l15-4v15M12 12l15-4"/><ellipse cx="8" cy="24" rx="4" ry="3" fill="currentColor"/><ellipse cx="23" cy="20" rx="4" ry="3" fill="currentColor"/></symbol>
</defs></svg>
<main class="scene">
<section id="menu">
<h1>Getallenrij</h1>
<div class="friends"><img src="assets/friends-together.webp" alt="Eekhoorn en Egel verzamelen samen eikels"></div>
<div class="choices">
<button class="selected" data-mode="computer" aria-pressed="true" aria-label="Eén speler tegen de computer"><span class="choice-art solo"><img src="assets/character-0-0.webp" alt=""><img class="computer-portrait" src="assets/computer-painted.webp" alt=""></span><small>1 speler</small></button>
<button data-mode="friend" aria-pressed="false" aria-label="Twee spelers"><span class="choice-art duo"><img src="assets/character-0-0.webp" alt=""><img src="assets/character-1-0.webp" alt=""></span><small>2 spelers</small></button>
</div>
<button id="start" class="wood start" aria-label="Spelen"><svg><use href="#play"/></svg></button>
</section>
<section id="game" hidden>
<p class="tie-note top" hidden>Hoogste worp wint!</p><p class="tie-note bottom" hidden>Hoogste worp wint!</p>
<section class="player opposite" id="player-1"><div class="cards" id="cards-1"></div><img class="character" id="character-1" src="assets/character-1-0.webp" alt="Egel"><span id="tie-throw-1" class="tie-throw" role="img" hidden></span><span class="sr" id="status-1"></span></section>
<section class="player" id="player-0"><div class="cards" id="cards-0"></div><img class="character" id="character-0" src="assets/character-0-0.webp" alt="Eekhoorn"><span id="tie-throw-0" class="tie-throw" role="img" hidden></span><span class="sr" id="status-0"></span></section>
<div class="dice-zone"><div class="shadow"></div><div class="motion"><div id="die" role="img" aria-label="Dobbelsteen"></div></div><button id="roll" aria-label="Dobbelsteen gooien"></button></div>
<img class="foreground" src="assets/leaves.webp" alt="">
<div id="guide" hidden aria-hidden="true"><span class="tap-ring"></span><img src="assets/guide-hand.svg" alt=""></div>
<p id="announcement" class="sr" aria-live="polite"></p>
</section>
<nav class="tools" aria-label="Spelknoppen">
<button class="tool game-tool" id="home-button" aria-label="Naar het beginscherm"><img src="assets/home-round.webp" alt=""></button>
<button class="tool game-tool" id="repeat-button" aria-label="Hulp beluisteren"><img src="assets/speaker-round.webp" alt=""></button>
<button id="music-button" class="tool music" aria-label="Zachte achtergrondmuziek aanzetten" aria-pressed="false"><img src="assets/music-painted.webp" alt=""><span class="music-state" aria-hidden="true"></span></button>
</nav>
<dialog id="intro" aria-labelledby="intro-title" data-step="0">
<h2 id="intro-title">Zo speel je</h2>
<button id="intro-skip" class="intro-skip" aria-label="Uitleg overslaan en spelen">Overslaan <span aria-hidden="true">››</span></button>
<section class="intro-panel">
<h3>6 eikels!</h3>
<img class="intro-friends" src="assets/friends-together.webp" alt="Verzamel zes eikels om te winnen">
<div class="intro-harvest" aria-label="Zes eikels"><img src="assets/magic-5.webp" alt=""><img src="assets/magic-5.webp" alt=""><img src="assets/magic-5.webp" alt=""><img src="assets/magic-5.webp" alt=""><img src="assets/magic-5.webp" alt=""><img src="assets/magic-5.webp" alt=""></div>
</section>
<section class="intro-panel" hidden>
<h3>Gooi, zoek, verzamel</h3>
<div class="intro-flow"><div class="demo-die" role="img" aria-label="Drie stippen"><i></i><i></i><i></i></div><span class="demo-arrow" aria-hidden="true">➜</span><div class="demo-change" role="img" aria-label="De kaart met drie wordt een eikel"><img class="demo-card" src="assets/card-3.webp" alt=""><img class="demo-acorn" src="assets/magic-5.webp" alt=""><img class="demo-hand" src="assets/guide-hand.svg" alt=""></div></div>
</section>
<section class="intro-panel" hidden>
<h3>Nog eens 3?</h3>
<div class="intro-flow"><div class="demo-die" role="img" aria-label="Weer drie stippen"><i></i><i></i><i></i></div><span class="demo-arrow" aria-hidden="true">➜</span><div class="demo-change demo-back" role="img" aria-label="De eikel wordt weer de kaart met drie"><img class="demo-card" src="assets/card-3.webp" alt=""><img class="demo-acorn" src="assets/magic-5.webp" alt=""><img class="demo-hand" src="assets/guide-hand.svg" alt=""></div></div>
</section>
<div class="intro-dots" aria-hidden="true"><i class="intro-dot current"></i><i class="intro-dot"></i><i class="intro-dot"></i></div>
<div class="intro-actions"><button id="intro-repeat" class="tool" aria-label="Uitleg nog eens beluisteren"><img src="assets/speaker-round.webp" alt=""></button><button id="intro-next" class="wood start" aria-label="Volgende stap"><svg><use href="#play"/></svg></button></div>
</dialog>
<dialog id="leave"><h2>Terug naar het begin?</h2><button class="wood" id="continue" aria-label="Verder spelen"><svg><use href="#play"/></svg></button><button class="cottage" id="quit" aria-label="Naar het begin"><img src="assets/home-round.webp" alt=""></button></dialog>
<dialog id="result" aria-labelledby="result-title"><img class="result-leaves left" src="assets/leaves.webp" alt=""><img class="result-leaves right" src="assets/leaves.webp" alt=""><h2 id="result-title" class="sr"></h2><div id="result-players"></div><button class="wood" id="again" aria-label="Nog een keer"><svg><use href="#again-icon"/></svg></button><button class="cottage" id="result-home" aria-label="Anders spelen"><img src="assets/home-round.webp" alt=""></button></dialog>
</main><script type="module" src="app.js?v=20261104b"></script>
</body></html>
